substitutions:
  name: nice-bust4-c6
  device_description: "Nice Bus T4 gateway — ESP32-C6"
  external_components_source: github://srepenko/Nice_BusT4@main

esphome:
  name: ${name}
  comment: ${device_description}
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  variant: ESP32C6
  board: esp32-c6-devkitc-1
  framework:
    type: arduino
    version: recommended

external_components:
  - source: ${external_components_source}
    refresh: 0s

logger:
  level: DEBUG
  # ESP32-C6 имеет USB Serial/JTAG на GPIO12/13.
  # baud_rate: 0 отключает вывод логов через UART0 (GPIO16/17).
  # Логи будут доступны через Home Assistant и веб-интерфейс.
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret esphome_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32-C6 поддерживает Wi-Fi 6 (802.11ax) — более эффективная работа
  # в загруженных сетях по сравнению с C3 (Wi-Fi 4).
  # Также доступны Zigbee и Thread (802.15.4) — актуально для будущего расширения.
  ap:
    ssid: "Gate C6 Fallback"
    password: "rJH9KDSki23h"

captive_portal:

web_server:
  version: 3

# -----------------------------------------------------------------------
# Пины ESP32-C6:
#   GPIO16 / GPIO17 — UART0 (мост USB↔UART по умолчанию), не использовать
#   GPIO12 / GPIO13 — USB Serial/JTAG, зарезервированы
#   GPIO8             — статусный светодиод на DevKitC-1
#
# Рекомендуемые пины для Serial1 (UART1):
#   TX → GPIO6, RX → GPIO7  (свободны на стандартном DevKitC-1)
# -----------------------------------------------------------------------

status_led:
  pin:
    number: GPIO8
    inverted: false

api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    - service: raw_command
      variables:
          raw_cmd: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);

    - service: send_inf_command
      variables:
         to_addr: string
         whose: string
         command: string
         type_command: string
         next_data: string
         data_on: bool
         data_command: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

    - service: gate_length_recognition
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("0b","01");

    - service: devices_recognition
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("0a","01");

    - service: closing_force
      variables:
        force: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("4b", force);

    - service: opening_force
      variables:
        force: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("4a", force);

button:
  - platform: template
    name: Пошагово
    id: sbs
    on_press:
      lambda: |-
           nice_cover -> NiceBusT4::send_cmd(bus_t4::SBS);

  - platform: template
    name: Статус входов
    id: in_stat
    on_press:
      lambda: |-
           nice_cover -> NiceBusT4::send_raw_cmd("55.0D.00.03.00.66.08.06.6B.04.D0.99.00.00.4D.0D");

  - platform: template
    name: Частичное открытие 1
    id: p_opn1
    on_press:
      lambda: |-
         nice_cover -> NiceBusT4::send_cmd(bus_t4::P_OPN1);

cover:
  - platform: bus_t4
    name: "Nice Cover"
    device_class: gate
    id: nice_cover
    tx_pin: 6    # GPIO6 — Serial1 TX (C6)
    rx_pin: 7    # GPIO7 — Serial1 RX (C6)
    # address: 0x0003      # адрес привода (если известен)
    # use_address: 0x0081  # адрес шлюза (если нужно переопределить)
    # oxi_address: 0x000A  # адрес приёмника OXI

switch:
  - platform: template
    name: "Автозакрытие"
    id: autoclose
    restore_mode: DISABLED
    lambda: |-
      if (nice_cover -> NiceBusT4::autocls_flag) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
    turn_off_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
