# ============================================================================
#  Nice Bus T4  -  вариант под ESP32-C6
# ----------------------------------------------------------------------------
#  Тестовая плата:  ESP32-C6-DevKitC-1
#  Модуль:          ESP32-C6-WROOM-1
#  Особенности C6:  Wi-Fi 6 (HE20), BT 5 LE, 802.15.4 (Thread/Zigbee/Matter)
#
#  ВАЖНО: framework = esp-idf обязателен.
#  Arduino-core 3.x для C6 в ESPHome поддерживается частично, а текущий
#  компонент bus_t4 завязан на HardwareSerial (Arduino-only). Поэтому,
#  чтобы эта YAML собралась, нужно сначала отвязать компонент от
#  Arduino - см. п. 2.1 в REVIEW.md (минимально - перевести на
#  ESPHome uart::UARTComponent или на ESP-IDF driver/uart.h).
#
#  Пины UART1:
#    TX = GPIO16
#    RX = GPIO17
#  Status-LED:
#    GPIO8 (на DevKit-C-1 это пользовательский синий LED, активный низкий)
#  802.15.4-антенна и Wi-Fi-антенна:
#    На WROOM-1 общая антенна, switching ставится автоматически.
# ============================================================================

substitutions:
  name: nice-bust4-c6
  device_description: "Nice Bus T4 gateway on ESP32-C6 (Wi-Fi 6 / Thread)"
  external_components_source: github://srepenko/Nice_BusT4@main

esphome:
  name: ${name}
  comment: ${device_description}
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
    board_build.flash_size: 4MB

esp32:
  variant: ESP32C6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    # Достаточно свежий IDF; для C6 нужен >= 5.1
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

external_components:
  - source: ${external_components_source}
    refresh: 0s

logger:
  level: DEBUG
  baud_rate: 0    # лог уходит через USB-Serial-JTAG, наш UART1 свободен

ota:
  - platform: esphome
    password: !secret esphome_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate Fallback Hotspot"
    password: "rJH9KDSki23h"

captive_portal:

web_server:
  version: 3

# Status LED - GPIO8 на C6 DevKit активный низкий
status_led:
  pin:
    number: GPIO8
    inverted: true

api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    - service: raw_command
      variables:
        raw_cmd: string
      then:
        lambda: 'nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);'

    - service: send_inf_command
      variables:
        to_addr: string
        whose: string
        command: string
        type_command: string
        next_data: string
        data_on: bool
        data_command: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

    - service: gate_length_recognition
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("0b","01");'

    - service: devices_recognition
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("0a","01");'

    - service: closing_force
      variables:
        force: string
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("4b", force);'

    - service: opening_force
      variables:
        force: string
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("4a", force);'

button:
  - platform: template
    name: "Пошагово"
    id: sbs
    on_press:
      lambda: 'nice_cover -> NiceBusT4::send_cmd(bus_t4::SBS);'

  - platform: template
    name: "Частичное открытие 1"
    id: p_opn1
    on_press:
      lambda: 'nice_cover -> NiceBusT4::send_cmd(bus_t4::P_OPN1);'

  - platform: restart
    name: "Restart Gate"

cover:
  - platform: bus_t4
    name: "Nice Cover"
    device_class: gate
    id: nice_cover
    tx_pin: 16                # ESP32-C6 (UART1)
    rx_pin: 17                # ESP32-C6 (UART1)
    # address: 0x0003
    # use_address: 0x0081

switch:
  - platform: template
    name: "Автозакрытие"
    id: autoclose
    restore_mode: DISABLED
    lambda: |-
      return nice_cover -> NiceBusT4::autocls_flag;
    turn_on_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
    turn_off_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");

# ----------------------------------------------------------------------------
#  Что C6 даёт сверху C3:
#    - Wi-Fi 6 (Target Wake Time, HE20) - ниже потребление в idle
#    - 802.15.4 - можно подключить как Matter-устройство к Apple/Google/Amazon
#      хабам (через openthread / matter компоненты ESPHome, когда они станут
#      стабильными для cover).
#    - RISC-V 160 МГц вместо 160 МГц RV32IMC у C3 - ощутимый плюс по IPC,
#      на 19200 бод незаметно, но при добавлении доп. компонентов пригодится.
# ----------------------------------------------------------------------------
