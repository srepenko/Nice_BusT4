substitutions:
  name: nice-bust4
  device_description: "Nice Walky gate"
  # компонент с настройками привода (ветка settings)
  external_components_source: github://srepenko/Nice_BusT4@main

esphome:
  name: ${name}
  comment: ${device_description}
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source: ${external_components_source}
    refresh: 0s

logger:
  level: DEBUG
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret esphome_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
  version: 3

status_led:
  pin:
    number: GPIO8
    inverted: true

api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    # отправка hex-команды на привод (для экспериментов)
    - service: raw_command
      variables:
        raw_cmd: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);
    - service: send_inf_command
      variables:
        to_addr: string
        whose: string
        command: string
        type_command: string
        next_data: string
        data_on: bool
        data_command: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

# ---------------- Ворота ----------------
cover:
  - platform: bus_t4
    name: "Nice Cover"
    device_class: gate
    id: nice_cover
    tx_pin: 21   # C3
    rx_pin: 20   # C3
    params_interval: 5min   # как часто перечитывать настройки из привода

# ---------------- Функции (вкл/выкл) ----------------
switch:
  - platform: bus_t4
    type: auto_close
    name: "Auto close"
    icon: mdi:gate-arrow-left
  - platform: bus_t4
    type: photo_close
    name: "Close after photo"
    icon: mdi:motion-sensor
  - platform: bus_t4
    type: always_close
    name: "Always close"
    icon: mdi:gate-alert
  - platform: bus_t4
    type: standby
    name: "Standby"
    icon: mdi:power-sleep
    entity_category: config
  - platform: bus_t4
    type: preflash
    name: "Pre-flashing"
    icon: mdi:alarm-light
    entity_category: config
  - platform: bus_t4
    type: operator_block
    name: "Operator block"
    icon: mdi:lock
  - platform: bus_t4
    type: key_lock
    name: "Key lock"
    icon: mdi:lock-outline
    entity_category: config

# ---------------- Параметры (числа) ----------------
number:
