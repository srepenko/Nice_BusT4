    type: pause_time
    name: "Pause time"
    icon: mdi:timer-sand
    mode: box
  - platform: bus_t4
    type: photo_close_time
    name: "Close after photo time"
    icon: mdi:timer-outline
    mode: box
    entity_category: config
  - platform: bus_t4
    type: always_close_time
    name: "Always close time"
    icon: mdi:timer-outline
    mode: box
    entity_category: config
  - platform: bus_t4
    type: standby_time
    name: "Standby time"
    mode: box
    entity_category: config
  - platform: bus_t4
    type: preflash_open_time
    name: "Pre-flashing open time"
    mode: box
    entity_category: config
  - platform: bus_t4
    type: preflash_close_time
    name: "Pre-flashing close time"
    mode: box
    entity_category: config
  - platform: bus_t4
    type: lamp_time
    name: "Courtesy light time"
    icon: mdi:lightbulb-on-outline
    mode: box
    entity_category: config
  - platform: bus_t4
    type: speed_open
    name: "Speed open"
    icon: mdi:speedometer
    entity_category: config
  - platform: bus_t4
    type: speed_close
    name: "Speed close"
    icon: mdi:speedometer
    entity_category: config
  - platform: bus_t4
    type: speed_slow_open
    name: "Speed slow open"
    icon: mdi:speedometer-slow
    entity_category: config
  - platform: bus_t4
    type: speed_slow_close
    name: "Speed slow close"
    icon: mdi:speedometer-slow
    entity_category: config
  - platform: bus_t4
    type: force_open
    name: "Force open"
    icon: mdi:arm-flex
    entity_category: config
  - platform: bus_t4
    type: force_close
    name: "Force close"
    icon: mdi:arm-flex
    entity_category: config
  - platform: bus_t4
    type: leaf_delay_open
    name: "Leaf delay open"
    mode: box
    entity_category: config
  - platform: bus_t4
    type: leaf_delay_close
    name: "Leaf delay close"
    mode: box
    entity_category: config
  - platform: bus_t4
    type: reverse_time
    name: "Reverse time"
    mode: box
