# ---------------- Режимы ----------------
select:
  - platform: bus_t4
    type: standby_mode
    name: "Standby mode"
    entity_category: config

# ---------------- Обслуживание ----------------
sensor:
  - platform: bus_t4
    type: maneuvers_count
    name: "Maneuvers count"
    icon: mdi:counter
  - platform: bus_t4
    type: maintenance_threshold
    name: "Maintenance threshold"
    icon: mdi:wrench-clock

# ---------------- Калибровки и команды ----------------
button:
  - platform: bus_t4
    type: learn_positions
    name: "Learn positions"
    icon: mdi:ruler
    entity_category: config
  - platform: bus_t4
    type: learn_bluebus
    name: "Learn BlueBus devices"
    icon: mdi:access-point-network
    entity_category: config
  - platform: bus_t4
    type: cancel_maintenance
    name: "Cancel maintenance"
    icon: mdi:wrench-check
    entity_category: config
  - platform: bus_t4
    type: refresh
    name: "Refresh settings"
    icon: mdi:refresh
    entity_category: diagnostic
  - platform: bus_t4
    type: step_by_step
    name: "Step by step"
    icon: mdi:gate-arrow-right
  - platform: bus_t4
    type: partial_open
    name: "Partial open"
    icon: mdi:gate-open
  - platform: template
    name: "Inputs status"
    id: in_stat
    entity_category: diagnostic
    on_press:
      lambda: |-
        nice_cover -> NiceBusT4::send_raw_cmd("55.0D.00.03.00.66.08.06.6B.04.D0.99.00.00.4D.0D");

# ---------------- Радиопульты ----------------
remote_receiver:
  pin:
    number: GPIO2
    inverted: True
  dump:
    - rc_switch
  tolerance: 60%
  filter: 4us
  idle: 4ms
binary_sensor:
  - platform: remote_receiver
    name: RF Button 1
    rc_switch_raw: 
      protocol: 6
      code: "000000000001010100010100"
    filters:
      - delayed_off: 250ms
    on_press:
      then:
        cover.open: nice_cover
  - platform: remote_receiver
    name: RF Button 2
    rc_switch_raw: 
      protocol: 6
      code: "000000000001010100010101"
    filters:
      - delayed_off: 250ms
    on_press:
      then:
        cover.close: nice_cover
  - platform: remote_receiver
    name: RF Button 3
    rc_switch_raw: 
      protocol: 6
      code: "000000000001010100010111"
    filters:
      - delayed_off: 250ms
