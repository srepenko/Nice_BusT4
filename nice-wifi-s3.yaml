# ============================================================================
#  Nice Bus T4  -  вариант под ESP32-S3
# ----------------------------------------------------------------------------
#  Тестовая плата:  ESP32-S3-DevKitC-1 (N8R2 / N16R8 - не важно)
#  Модуль:          ESP32-S3-WROOM-1
#  Framework:       arduino  (компонент уже работает на HardwareSerial)
#                   при желании можно переключить на esp-idf - см. REVIEW.md
#
#  Питание:         5 В на USB / 5 В DC-DC (тот же, что в схеме адаптера)
#  Трансивер:       SN65HVD230 / TJA1051 - подключение точно как у C3
#
#  Пины UART1:
#    TX = GPIO17           (свободны на DevKit-C-1, не пересекаются с USB/JTAG)
#    RX = GPIO18
#  Status-LED:
#    GPIO48 - WS2812 на DevKit-C-1 (RGB, активный высокий) - см. ниже
#    Если у вас модуль без WS2812, замените на любой свободный GPIO + invert.
#
#  ВАЖНО про пины S3:
#    GPIO19/20  - USB D-/D+   (CDC log) - НЕ использовать
#    GPIO43/44  - UART0 / USB-Serial-JTAG - лучше тоже не трогать
#    GPIO39-42  - JTAG (на некоторых плата выведены)
# ============================================================================

substitutions:
  name: nice-bust4-s3
  device_description: "Nice Bus T4 gateway on ESP32-S3"
  external_components_source: github://srepenko/Nice_BusT4@main

esphome:
  name: ${name}
  comment: ${device_description}
  platformio_options:
    board_build.f_flash: 80000000L          # S3 умеет 80 МГц QIO/DIO
    board_build.flash_mode: qio
    board_build.flash_size: 8MB             # подставьте под свой модуль

esp32:
  variant: ESP32S3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    # type: esp-idf                         # альтернатива - даст hardware break

external_components:
  - source: ${external_components_source}
    refresh: 0s

# ---- Логи -----------------------------------------------------------------
# baud_rate: 0 - отключаем UART-лог (UART0 на S3 идёт в USB-Serial-JTAG,
# чтобы не мешать нашему BusT4 на UART1, явно тушим UART-лог).
logger:
  level: DEBUG
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret esphome_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate Fallback Hotspot"
    password: "rJH9KDSki23h"

captive_portal:

web_server:
  version: 3

# ---- Status LED -----------------------------------------------------------
# На DevKit-C-1 распаян адресный WS2812 на GPIO48.
# Если у вас обычный GPIO-светодиод - замените на блок status_led.
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    name: "Status LED"
    id: status_led
    internal: true
    effects:
      - pulse:
          name: "Slow pulse"
          transition_length: 1s
          update_interval: 1s

# ---- API + сервисы ---------------------------------------------------------
api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    - service: raw_command
      variables:
        raw_cmd: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);

    - service: send_inf_command
      variables:
        to_addr: string
        whose: string
        command: string
        type_command: string
        next_data: string
        data_on: bool
        data_command: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

    - service: gate_length_recognition
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("0b","01");'

    - service: devices_recognition
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("0a","01");'

    - service: closing_force
      variables:
        force: string
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("4b", force);'

    - service: opening_force
      variables:
        force: string
      then:
        lambda: 'nice_cover -> NiceBusT4::set_mcu("4a", force);'

# ---- Кнопки ---------------------------------------------------------------
button:
  - platform: template
    name: "Пошагово"
    id: sbs
    on_press:
      lambda: 'nice_cover -> NiceBusT4::send_cmd(bus_t4::SBS);'

  - platform: template
    name: "Частичное открытие 1"
    id: p_opn1
    on_press:
      lambda: 'nice_cover -> NiceBusT4::send_cmd(bus_t4::P_OPN1);'

  - platform: restart
    name: "Restart Gate"

# ---- Сама автоматика ------------------------------------------------------
cover:
  - platform: bus_t4
    name: "Nice Cover"
    device_class: gate
    id: nice_cover
    tx_pin: 17                # ESP32-S3
    rx_pin: 18                # ESP32-S3
    # address: 0x0003
    # use_address: 0x0081

# ---- Флаг автозакрытия ----------------------------------------------------
switch:
  - platform: template
    name: "Автозакрытие"
    id: autoclose
    restore_mode: DISABLED
    lambda: |-
      return nice_cover -> NiceBusT4::autocls_flag;
    turn_on_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
    turn_off_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
