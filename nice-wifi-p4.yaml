substitutions:
  name: nice-bust4-p4
  device_description: "Nice Bus T4 gateway — ESP32-P4"
  external_components_source: github://srepenko/Nice_BusT4@main

# =======================================================================
# ESP32-P4 — СТАТУС ПОДДЕРЖКИ (май 2026)
# =======================================================================
#
# ESP32-P4 — высокопроизводительный чип (dual-core Xtensa LX7 + RISC-V LP).
# Для данного проекта (простой шлюз Bus T4) мощность P4 избыточна,
# но конфигурация приведена для тех, кто уже использует эту плату.
#
# ТРЕБОВАНИЯ К КОМПОНЕНТУ:
#   Текущая реализация использует Arduino HardwareSerial (Serial1) и
#   Serial1.updateBaudRate() для генерации break-сигнала.
#   Если используется Arduino framework, компонент работает без изменений.
#   Если используется ESP-IDF framework, нужно переписать send_array_cmd:
#
#     // Вместо Serial1.updateBaudRate(BAUD_BREAK) / Serial1.updateBaudRate(BAUD_WORK)
#     // использовать IDF UART API:
#     uart_set_baudrate(UART_NUM_1, BAUD_BREAK);
#     uart_write_bytes(UART_NUM_1, &br_ch, 1);
#     esp_rom_delay_us(90);
#     uart_set_baudrate(UART_NUM_1, BAUD_WORK);
#     uart_write_bytes(UART_NUM_1, data, len);
#
# РЕКОМЕНДУЕМЫЙ ПУТЬ:
#   Переход на ESPHome нативный uart компонент (esphome/components/uart) с
#   кастомным низкоуровневым вызовом для переключения baudrate — обеспечит
#   совместимость со всеми фреймворками и чипами в будущем.
# =======================================================================

esphome:
  name: ${name}
  comment: ${device_description}
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
    board_build.flash_size: 16MB  # P4 обычно поставляется с 16 МБ флэш

esp32:
  variant: ESP32P4
  # Уточните имя платы в документации PlatformIO для вашего конкретного модуля.
  # Официальный evaluation board от Espressif:
  board: esp32-p4-function-ev-board
  framework:
    type: arduino
    # Arduino framework для P4: убедитесь, что используется ESP-Arduino >= 3.x
    # с официальной поддержкой ESP32-P4.
    version: recommended

external_components:
  - source: ${external_components_source}
    refresh: 0s

logger:
  level: DEBUG
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret esphome_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate P4 Fallback"
    password: "rJH9KDSki23h"

captive_portal:

web_server:
  version: 3

# -----------------------------------------------------------------------
# Пины ESP32-P4:
#   P4 имеет богатую матрицу GPIO и несколько UART.
#   Практически любой GPIO можно назначить на UART через GPIO Matrix.
#   Пины ниже — рекомендуемые свободные GPIO для UART1.
#   Проверьте распиновку вашей конкретной платы перед подключением.
# -----------------------------------------------------------------------

status_led:
  pin:
    number: GPIO3
    inverted: false

api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    - service: raw_command
      variables:
          raw_cmd: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);

    - service: send_inf_command
      variables:
         to_addr: string
         whose: string
         command: string
         type_command: string
         next_data: string
         data_on: bool
         data_command: string
      then:
        lambda: |-
          nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

    - service: gate_length_recognition
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("0b","01");

    - service: devices_recognition
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("0a","01");

    - service: closing_force
      variables:
        force: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("4b", force);

    - service: opening_force
      variables:
        force: string
      then:
        lambda: |-
           nice_cover -> NiceBusT4::set_mcu("4a", force);

button:
  - platform: template
    name: Пошагово
    id: sbs
    on_press:
      lambda: |-
           nice_cover -> NiceBusT4::send_cmd(bus_t4::SBS);

  - platform: template
    name: Статус входов
    id: in_stat
    on_press:
      lambda: |-
           nice_cover -> NiceBusT4::send_raw_cmd("55.0D.00.03.00.66.08.06.6B.04.D0.99.00.00.4D.0D");

  - platform: template
    name: Частичное открытие 1
    id: p_opn1
    on_press:
      lambda: |-
         nice_cover -> NiceBusT4::send_cmd(bus_t4::P_OPN1);

cover:
  - platform: bus_t4
    name: "Nice Cover"
    device_class: gate
    id: nice_cover
    tx_pin: 17   # GPIO17 — Serial1 TX (P4), скорректируйте под вашу плату
    rx_pin: 18   # GPIO18 — Serial1 RX (P4), скорректируйте под вашу плату
    # address: 0x0003      # адрес привода (если известен)
    # use_address: 0x0081  # адрес шлюза (если нужно переопределить)
    # oxi_address: 0x000A  # адрес приёмника OXI

switch:
  - platform: template
    name: "Автозакрытие"
    id: autoclose
    restore_mode: DISABLED
    lambda: |-
      if (nice_cover -> NiceBusT4::autocls_flag) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
    turn_off_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");
