cover:
- platform: bus_t4
  name: "Nice Cover"
  device_class: gate
  id: nice_cover
  # Пины UART для Serial1 (назначаются на любой свободный GPIO):
  tx_pin: 21   # ESP32-C3: GPIO21  |  ESP32-S3: GPIO17  |  ESP32-C6: GPIO16
  rx_pin: 20   # ESP32-C3: GPIO20  |  ESP32-S3: GPIO18  |  ESP32-C6: GPIO17
  # address: 0x0003     # адрес контроллера привода (авто-определяется через WHO)
  # use_address: 0x0081 # адрес этого шлюза (по умолчанию 0x0066)
  # oxi_address: 0x000A # адрес приёмника OXI (авто-определяется через WHO)

# работаем с приёмником OXI

# отключаем автозакрытие ворот, если это нужно для погрузочно-разгрузочных работ
switch:
  - platform: template
    name: "Автозакрытие"
    id: autoclose
    restore_mode: DISABLED
#    optimistic: true
    lambda: |-
      if (nice_cover -> NiceBusT4::autocls_flag) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");                
    turn_off_action:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "a9", "00", true, "00");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "80", "99", "00", true, "01");
        nice_cover -> NiceBusT4::send_inf_cmd("0003", "04", "84", "99", "00", true, "01");                        


              
