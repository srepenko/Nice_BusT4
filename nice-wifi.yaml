substitutions:
  name: nice-bust4
  device_description: ""
  external_components_source: github://srepenko/Nice_BusT4@main

esphome:
  name: ${name}
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

# ============================================================
# Выбор платформы — раскомментируйте нужный блок
# ============================================================

# --- ESP32-C3 (текущий вариант) ----------------------------
# Недорогой RISC-V, WiFi 4, одно ядро. Проверен в работе.
# GPIO20 = RX, GPIO21 = TX  (Serial1)
esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# --- ESP32-S3 -----------------------------------------------
# Xtensa dual-core, WiFi 4, больше RAM/Flash, USB-OTG.
# Пины можно назначить на любой свободный GPIO.
# Типичный выбор: GPIO17 = TX, GPIO18 = RX  (Serial1)
# Раскомментируйте этот блок и закомментируйте блок C3 выше.
#esp32:
#  variant: ESP32S3
#  board: esp32s3-devkitc-1
#  framework:
#    type: arduino
#  platformio_options:
#    board_build.f_flash: 80000000L
#    board_build.flash_mode: qio
#    board_build.flash_size: 8MB

# --- ESP32-C6 -----------------------------------------------
# RISC-V, WiFi 6 (802.11ax), Zigbee/Thread 802.15.4, одно ядро.
# Улучшенная дальность/надёжность WiFi по сравнению с C3.
# Типичный выбор: GPIO16 = TX, GPIO17 = RX  (Serial1)
# Статус: поддержка Arduino stable начиная с arduino-esp32 3.x
#esp32:
#  variant: ESP32C6
#  board: esp32-c6-devkitc-1
#  framework:
#    type: arduino
#    version: recommended

# --- ESP32-P4 -----------------------------------------------
# ВНИМАНИЕ: ESP32-P4 НЕ имеет встроенного WiFi/BT.
# Для работы с ESPHome требуется внешний WiFi-сопроцессор
# (например, ESP32-C6 через SPI/SDIO — плата ESP32-P4-Function-EV-Board).
# Поддержка ESPHome для P4 находится в статусе experimental (2025).
# Для Bus T4 нет препятствий по UART — P4 имеет 5 аппаратных UART,
# тайминги break через updateBaudRate работают аналогично другим чипам.
# Когда появится стабильная поддержка:
#esp32:
#  variant: ESP32P4
#  board: esp32p4-function-ev-board
#  framework:
#    type: esp-idf  # arduino для P4 пока не доступен в стабильном релизе
# ============================================================


external_components:
  - source: ${external_components_source}
    refresh: 0s
    
# Enable logging
logger:
  level: DEBUG
  #tx_buffer_size: 2048
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret esphome_ota_key
    

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Gate Fallback Hotspot"
    password: "rJH9KDSki23h"

captive_portal:

web_server:
  version: 3
#  js_include: "www.js"
#  js_url: ""
#  version: 2  
# Enable Home Assistant API

#uart:
#  id: uart_0
#  baud_rate: 19200
#  tx_pin: GPIO21
#  rx_pin: GPIO20

# Set statul led
status_led:
  pin: 
    number: GPIO8
    inverted: true

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_encryption_key
#  reboot_timeout: 0s # иначе перезагружается при отключении от hassio  
  services:
# для отправки hex команд на привод
  - service: raw_command
    variables:
        raw_cmd: string
    then:
      lambda: |-
         nice_cover -> NiceBusT4::send_raw_cmd(raw_cmd);
         
  - service: send_inf_command
    variables:
       to_addr: string
       whose: string
       command: string
       type_command: string
       next_data: string
       data_on: bool
       data_command: string
    then:
      lambda: |-
        nice_cover -> NiceBusT4::send_inf_cmd(to_addr, whose, command, type_command, next_data, data_on, data_command);

# распознавание длины створки
  - service: gate_length_recognition
    then:
      lambda: |-
         nice_cover -> NiceBusT4::set_mcu("0b","01");

# распознавание устройств BlueBus
  - service: devices_recognition
    then:
      lambda: |-
         nice_cover -> NiceBusT4::set_mcu("0a","01");         

# усилие при закрытии
  - service: closing_force
    variables:
      force: string
    then:
      lambda: |-
         nice_cover -> NiceBusT4::set_mcu("4b", force);         

# усилие при открытии
  - service: opening_force
    variables:
      force: string
    then:
      lambda: |-
         nice_cover -> NiceBusT4::set_mcu("4a", force);


# Кнопки для отправки команд
